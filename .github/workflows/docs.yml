name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser for checks
        run: npx playwright install --with-deps chromium
      - name: Check downloader
        run: npm test
      - name: Read GitHub Pages settings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build documentation
        run: npm run docs:build
        env:
          VITEPRESS_BASE: ${{ github.event_name == 'pull_request' && '/preview/' || steps.pages.outputs.base_path || '/' }}
      - name: Check diagrams and navigation in browser
        run: npm run docs:check
        env:
          VITEPRESS_BASE: ${{ github.event_name == 'pull_request' && '/preview/' || steps.pages.outputs.base_path || '/' }}
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
